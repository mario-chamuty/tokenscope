name: Build TokenScope

on:
  workflow_dispatch:
    inputs:
      only:
        description: Which targets to build
        type: choice
        options:
          - all
          - macos-arm
        default: all
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    if: inputs.only != 'macos-arm'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    if: inputs.only != 'macos-arm'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    if: inputs.only != 'macos-arm'
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Create self-signed code-signing identity
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12_PASSWORD="$(openssl rand -hex 16)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj "/CN=TokenScope Self-Signed/O=Version Two s.r.o." \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=critical,codeSigning"
          openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
            -out "$RUNNER_TEMP/cert.p12" -passout "pass:$P12_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/cert.p12"
      - name: Build (Apple Silicon)
        env:
          APPLE_SIGNING_IDENTITY: TokenScope Self-Signed
        run: cargo tauri build --target aarch64-apple-darwin --bundles dmg
      - name: Build (Intel)
        if: inputs.only != 'macos-arm'
        env:
          APPLE_SIGNING_IDENTITY: TokenScope Self-Signed
        run: cargo tauri build --target x86_64-apple-darwin --bundles dmg
      - name: Verify the app inside each dmg is signed
        run: |
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            mount="$(mktemp -d)"
            hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
            codesign --verify --deep --strict --verbose=2 "$mount/TokenScope.app"
            codesign -dv "$mount/TokenScope.app" 2>&1 | grep -q "Authority=TokenScope Self-Signed"
            hdiutil detach "$mount"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TokenScope ${GITHUB_REF_NAME#v}" \
            --generate-notes
